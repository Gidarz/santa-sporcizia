function pickVariant(t) { // t: 0..1 deterministic
  let cum = 0;
  for (const v of TREE_VARIANTS) {
    cum += v.w;
    if (t < cum) return v;
  }
  return TREE_VARIANTS[0];
}

/* ═══════════════════════════════════════════════
   SOUND
═══════════════════════════════════════════════ */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); this._drone(); } catch(e) {}
  }
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume().catch(()=>{}); }
  _drone() {
    const o1=this.ctx.createOscillator(), o2=this.ctx.createOscillator();
    const g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    o1.type=o2.type='sawtooth'; o1.frequency.value=28; o2.frequency.value=30.5;
    g.gain.value=0.024; f.type='lowpass'; f.frequency.value=85;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.ctx.destination);
    o1.start(); o2.start();
  }
  _shot(freq,type,dur,vol,endFreq) {
    if (!this.ctx) return;
    const o=this.ctx.createOscillator(), gn=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,this.ctx.currentTime);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq,this.ctx.currentTime+dur);
    gn.gain.setValueAtTime(vol,this.ctx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+dur);
    o.connect(gn); gn.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime+dur);
  }
  footstep()    { this._shot(46,'triangle',0.08,0.10,7); }
  triggerStab() { [62,82,56].forEach((f,i)=>setTimeout(()=>this._shot(f,'sawtooth',0.55,0.14),i*75)); }
  doorCreak() {
    if (!this.ctx) return;
    const o=this.ctx.createOscillator(), gn=this.ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(290,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(170,this.ctx.currentTime+1.3);
    gn.gain.setValueAtTime(0.065,this.ctx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+1.3);
    o.connect(gn); gn.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime+1.3);
  }
}

function h53(x,z,s) {
  return Math.abs(Math.sin(x*127.1+z*311.7+s*74.5)*43758.5453)%1;
}

function makeTextSprite(text) {
  const lines=text.split('\n'), fs=20, lh=fs+10;
  const W=512, H=lh*lines.length+20;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  cx.clearRect(0,0,W,H);
  cx.font=`900 ${fs}px "Courier New",monospace`; cx.textAlign='center';
  cx.strokeStyle='#111'; cx.lineWidth=6; cx.lineJoin='round';
  lines.forEach((ln,i)=>cx.strokeText(ln,W/2,lh*(i+1)));
  cx.fillStyle='#dcc84a';
  lines.forEach((ln,i)=>cx.fillText(ln,W/2,lh*(i+1)));
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:true}));
  sp.scale.set((W/H)*1.1,1.1,1); return sp;
}

function makeVoxelTex(palette) {
  const W=64, H=64, cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  for (let py=0;py<H;py+=4)
    for (let px=0;px<W;px+=4) {
      const n=Math.abs(Math.sin(px*127.1+py*311.7)*43758.5453)%1;
      const [r,g,b]=palette[Math.floor(n*palette.length)];
      cx.fillStyle=`rgb(${r},${g},${b})`; cx.fillRect(px,py,4,4);
    }
  cx.fillStyle='rgba(0,0,0,0.22)';
  for (let i=0;i<W;i+=8) { cx.fillRect(i,0,1,H); cx.fillRect(0,i,W,1); }
  const t=new THREE.CanvasTexture(cv);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  return t;
}

const TL=new THREE.TextureLoader();

function phTex(path,rS,rT,isNorm) {
  const t=TL.load(PH+path,tex=>{
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    tex.repeat.set(rS||1,rT||rS||1);
    tex.encoding=isNorm?THREE.LinearEncoding:THREE.sRGBEncoding;
    tex.needsUpdate=true;
  },undefined,()=>{});
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rS||1,rT||rS||1);
  return t;
}

/* ═══════════════════════════════════════════════
   GLTF LOADING
═══════════════════════════════════════════════ */
function loadModels() {
  const loader=new THREE.GLTFLoader();
  const total=Object.keys(MODEL_URLS).length;
  let loaded=0;
  const bar=document.getElementById('loading-bar');

  return new Promise(resolve=>{
    const timeout=setTimeout(()=>resolve(), 6000); // 6s max wait

    let remaining=total;
    Object.entries(MODEL_URLS).forEach(([key,url])=>{
      loader.load(url, gltf=>{
        // Darken for horror atmosphere + enable shadows
        gltf.scene.traverse(node=>{
          if (!node.isMesh) return;
          const mats=Array.isArray(node.material)?node.material:[node.material];
          node.material=mats.map(m=>{
            const c=m.clone();
            c.color.multiplyScalar(0.15);
            c.roughness=1.0; c.metalness=0;
            if (c.emissive) c.emissive.set(0,0,0);
            return c;
          });
          if (!Array.isArray(node.material)) node.material=node.material[0];
          node.castShadow=true; node.receiveShadow=false;
        });
        MODELS[key]=gltf.scene;
        loaded++;
        bar.style.width=Math.round((loaded/total)*100)+'%';
        if (--remaining===0) { clearTimeout(timeout); resolve(); }
      }, undefined, ()=>{
        loaded++;
        bar.style.width=Math.round((loaded/total)*100)+'%';
        if (--remaining===0) { clearTimeout(timeout); resolve(); }
      });
    });
  });
}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
function buildBodyMesh() {
  const ragMat=new THREE.MeshLambertMaterial({map:makeVoxelTex([
    [42,30,20],[50,38,26],[35,25,16],[28,20,12],[58,44,30],[22,15,9],
  ])});
  const bootMat=new THREE.MeshLambertMaterial({map:makeVoxelTex([
    [22,15,9],[28,20,12],[18,12,7],[15,10,5],[32,22,14],[12,8,4],
  ])});
  const grp=new THREE.Group();
  function vox(w,h,d,x,y,z,mat) {
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z); grp.add(m);
  }
  vox(0.40,0.55,0.22, 0,   -0.72,0.22,ragMat);
  vox(0.12,0.52,0.12,-0.28,-0.72,0.21,ragMat);
  vox(0.12,0.52,0.12, 0.28,-0.72,0.21,ragMat);
  vox(0.44,0.22,0.22, 0,   -1.10,0.22,ragMat);
  vox(0.16,0.54,0.16,-0.13,-1.46,0.22,bootMat);
  vox(0.16,0.54,0.16, 0.13,-1.46,0.22,bootMat);
  grp.visible=false; return grp;
}

function init() {
  const canvas=document.getElementById('c');

  scene.fog=new THREE.FogExp2(0x1a1a14,0.18);

  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.04,80);
  camera.rotation.order='YXZ';

  renderer=new THREE.WebGLRenderer({canvas,antialias:false});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=0.75;

  scene.add(new THREE.AmbientLight(0x0c1008,0.18));

  const ptL=new THREE.PointLight(0xb8c860,1.4,22);
  ptL.position.set(0,4.5,CHURCH_Z+1.5);
  scene.add(ptL); scene.userData.ptLight=ptL;

  flashlight=new THREE.SpotLight(0xffe8c0,flashBase,22,Math.PI/8,0.32,1.3);
  flashlight.castShadow=true;
  flashlight.shadow.mapSize.set(512,512);
  flashlight.shadow.camera.near=0.4;
  flashlight.shadow.camera.far=22;
  scene.add(flashlight); scene.add(flashlight.target);

  camera.position.set(0,2.2,8);
  camera.rotation.set(-0.20,0,0);

  bodyGroup=buildBodyMesh(); scene.add(bodyGroup);
  setupControls();
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  clock.start();
  animate(); // starts rendering immediately (loading screen on top)
}

  buildPath(); buildPebbles(); buildPuddles();
  buildFencePosts(); buildGraves();
  buildTrees(); buildVegetation();

  // Field bounds

/* ─── PATH ─────────────────────────────────── */
function buildPath() {

    color:0x201408,roughness:0.95,

/* ─── PEBBLES ────────────────────────────── */
function buildPebbles() {
  const M4=new THREE.Matrix4(),VP=new THREE.Vector3(),VQ=new THREE.Quaternion(),VS=new THREE.Vector3();
  function instanced(geo,mat,n,scMin,scMax,yBase,scY) {
    const im=new THREE.InstancedMesh(geo,mat,n);
    for (let i=0;i<n;i++) {
      VP.set((Math.random()-0.5)*114,yBase,(Math.random()-0.5)*114);
      VQ.setFromEuler(new THREE.Euler(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI));
      const s=scMin+Math.random()*(scMax-scMin);
      VS.set(s,s*(scY||0.55),s);
      im.setMatrixAt(i,M4.compose(VP,VQ,VS));
    }
    im.instanceMatrix.needsUpdate=true; scene.add(im);
  }
  instanced(new THREE.DodecahedronGeometry(0.04,0),
    new THREE.MeshStandardMaterial({color:0x2c2418,roughness:1}),3000,0.3,0.9,0.02);
  instanced(new THREE.DodecahedronGeometry(0.12,0),
    new THREE.MeshStandardMaterial({color:0x282018,roughness:1}),500,0.4,1.2,0.05);

  // Rock clusters
  const rMat=new THREE.MeshStandardMaterial({color:0x242018,roughness:0.95});
  const rGeo=new THREE.DodecahedronGeometry(1,0);
  [[-3.5,-6.5,0.62],[2.5,-11.5,0.50],[-5.5,-14,0.92],[4,-8,0.55],[-9,-19,0.75],
   [1.5,-22,0.42],[-1.5,-7.5,0.35],[3.5,-17,0.52],[8,-27,0.44],[-6,-32,0.58],
   [0.5,-40,0.38],[5.5,-36,0.45],[-11,-12,0.66],[7,-16,0.38],[-3,-45,0.52],
  ].forEach(([rx,rz,rs])=>{
    const r=new THREE.Mesh(rGeo,rMat);
    r.scale.set(rs*1.2,rs*0.62,rs);
    r.position.set(rx,rs*0.36,rz);
    r.rotation.set(Math.random(),Math.random()*Math.PI,Math.random());
    r.castShadow=true; r.receiveShadow=true; scene.add(r);
  });
}

/* ═══════════════════════════════════════════════
   GLTF TREES  (with procedural fallback)
═══════════════════════════════════════════════ */
function buildTrees() {
  const anyLoaded=Object.keys(MODELS).length>0;

  TREE_POS.forEach(([tx,tz],idx)=>{
    let grp;
    if (anyLoaded) {
      grp=placeGLTFTree(tx,tz,idx);
    } else {
      grp=makeDeadTreeProcedural(tx,tz,
        4.5+h53(tx,tz,1)*3.0,
        0.7+h53(tx,tz,2)*0.6);
    }
    scene.add(grp); treeGroups.push(grp);
    walls.push(new THREE.Box3(
      new THREE.Vector3(tx-0.7,0,tz-0.7),
      new THREE.Vector3(tx+0.7,8,tz+0.7)
    ));
  });

  // Italian signs on trees
  TREE_POS.forEach(([tx,tz],idx)=>{
    if (idx%5!==0) return;
    const sp=makeTextSprite(SIGN_TEXTS[Math.floor(idx/5)%SIGN_TEXTS.length]);
    sp.position.set(tx+0.4, 3.5, tz+0.1); scene.add(sp);
  });

  // Fallen logs as props
  addFallenLogs();
}

function placeGLTFTree(tx,tz,idx) {
  const t=h53(tx,tz,7);
  const v=pickVariant(t);
  const mdl=MODELS[v.key];
  const grp=new THREE.Group();
  grp.position.set(tx,0,tz);
  grp.rotation.y=h53(tx,tz,3)*Math.PI*2;

  if (mdl) {
    const clone=mdl.clone(true);
    const s=v.scaleBase+h53(tx,tz,9)*v.scaleVar;
    clone.scale.set(s,s,s);
    grp.add(clone);
  } else {
    // fallback procedural tree
    const fb=makeDeadTreeProcedural(0,0,4.5+h53(tx,tz,1)*3.0,0.7+h53(tx,tz,2)*0.6);
    fb.position.set(0,0,0); grp.add(fb);
  }
  return grp;
}

function addFallenLogs() {
  const fallKeys=['pineFall','pineFallCrooked','trunkLong'];
  [[3,-11],[-7,-19],[5,-27],[-4,-33],[2,-38],[6,-44],[-3,-17]].forEach(([x,z])=>{
    const key=fallKeys[Math.floor(Math.abs(Math.sin(x*z)*10))%fallKeys.length];
    const mdl=MODELS[key];
    if (!mdl) return;
    const grp=new THREE.Group();
    grp.position.set(x,0,z);
    grp.rotation.y=Math.random()*Math.PI*2;
    const s=3.5+Math.random()*2.0;
    const clone=mdl.clone(true); clone.scale.set(s,s,s);
    grp.add(clone); scene.add(grp);
  });
}

/* ═══════════════════════════════════════════════
   GLTF VEGETATION (grass + plants)
═══════════════════════════════════════════════ */
function buildVegetation() {
  // Grass patches — scattered everywhere
  if (MODELS.grassPatch) {
    for (let i=0;i<180;i++) {
      const x=(Math.random()-0.5)*112, z=(Math.random()-0.5)*112;
      const clone=MODELS.grassPatch.clone(true);
      const s=1.8+Math.random()*1.4;
      clone.scale.set(s,s,s);
      clone.position.set(x,0,z);
      clone.rotation.y=Math.random()*Math.PI*2;
      scene.add(clone);
    }
  } else {
    buildFallbackShrubs(); // procedural shrubs if no GLTF
  }

  // Weeds / small plants
  if (MODELS.plant) {
    for (let i=0;i<120;i++) {
      const x=(Math.random()-0.5)*112, z=(Math.random()-0.5)*112;
      const clone=MODELS.plant.clone(true);
      const s=1.4+Math.random()*2.0;
      clone.scale.set(s,s*1.2,s);
      clone.position.set(x,0,z);
      clone.rotation.y=Math.random()*Math.PI*2;
      scene.add(clone);
    }
  }
}

/* ═══════════════════════════════════════════════
   PROCEDURAL DEAD TREE (fallback)
═══════════════════════════════════════════════ */
function makeDeadTreeProcedural(x,z,h,sc) {
  const mat=new THREE.MeshStandardMaterial({color:0x181009,roughness:1});
  const grp=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.11*sc,0.21*sc,h,7),mat);
  trunk.position.y=h/2; trunk.castShadow=true; grp.add(trunk);
  [[0.55,0.4,0.65,2.2],[0.62,2.6,0.55,1.9],[0.72,1.1,0.5,1.6],
   [0.48,4.0,0.60,2.0],[0.80,5.5,0.42,1.3],[0.40,3.2,0.68,1.7]
  ].forEach(([hf,az,lean,len])=>{
    const pv=new THREE.Group();
    pv.position.y=h*hf; pv.rotation.order='YXZ';
    pv.rotation.y=az+h53(x,z,hf)*0.4; pv.rotation.x=lean;
    const br=new THREE.Mesh(new THREE.CylinderGeometry(0.03*sc,0.065*sc,len*sc,5),mat);
    br.position.y=(len*sc)/2; br.castShadow=true; pv.add(br); grp.add(pv);
  });
  grp.position.set(x,0,z); grp.rotation.y=h53(x,z,3)*Math.PI*2;
  return grp;
}

/* ═══════════════════════════════════════════════
   CHURCH
═══════════════════════════════════════════════ */
function buildChurch() {
  const cz=CHURCH_Z;
  const brkMat=new THREE.MeshStandardMaterial({color:0x1e1a14,roughness:0.92,map:TEX.brkD,normalMap:TEX.brkN,normalScale:new THREE.Vector2(1,1)});
  const cblMat=new THREE.MeshStandardMaterial({color:0x1c1a14,roughness:0.94,map:TEX.cblD,normalMap:TEX.cblN,normalScale:new THREE.Vector2(0.9,0.9)});
  const wdMat =new THREE.MeshStandardMaterial({color:0x201408,roughness:0.97,map:TEX.wdD, normalMap:TEX.wdN, normalScale:new THREE.Vector2(0.7,0.7)});
  const darkMat=new THREE.MeshStandardMaterial({color:0x0c0a06,roughness:0.95});

  function box(w,h,d,x,y,z,mat) {
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||brkMat);
    m.position.set(x,y,z+cz); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  }
  box(2.9,6,0.5,-2.95,3,0); box(2.9,6,0.5,2.95,3,0); box(8,2,0.5,0,5,0);
  box(0.5,6,13,-4,3,-6.5); box(0.5,6,13,4,3,-6.5);
  box(9,6,0.5,0,3,-13);
  box(10,0.45,13.5,0,6.25,-6.5);
  box(9,5.8,13,0,2.9,-6.5,darkMat);

  const fl=new THREE.Mesh(new THREE.PlaneGeometry(8.8,12.6),cblMat);
  fl.rotation.x=-Math.PI/2; fl.position.set(0,0.01,cz-6.5);
  fl.receiveShadow=true; scene.add(fl);

  [0,1,2].forEach(i=>{
    const sw=3.8-i*0.35, sh=0.18;
    const st=new THREE.Mesh(new THREE.BoxGeometry(sw,sh,0.55),cblMat);
    st.position.set(0,sh/2+i*sh,cz+0.55-i*0.55);
    st.receiveShadow=true; st.castShadow=true; scene.add(st);
  });

  // Ajar door (right)
  const dGeo=new THREE.BoxGeometry(1.05,3.9,0.07);
  const dR=new THREE.Mesh(dGeo,wdMat); dR.position.set(-0.525,1.95,0.04); dR.castShadow=true;
  const pivR=new THREE.Group(); pivR.position.set(1.07,0,cz); pivR.add(dR); pivR.rotation.y=-0.16; scene.add(pivR);
  const dL=new THREE.Mesh(dGeo,wdMat); dL.position.set(-0.56,1.95,cz+0.04); dL.castShadow=true; scene.add(dL);

  const doorLamp=new THREE.PointLight(0xc0d850,1.2,14);
  doorLamp.position.set(0,4.5,cz+0.8); scene.add(doorLamp); scene.userData.doorLamp=doorLamp;

  [[-2.95,3,0,2.9,6,0.5],[2.95,3,0,2.9,6,0.5]].forEach(([x,y,z,w,h,d])=>{
    walls.push(new THREE.Box3(new THREE.Vector3(x-w/2,0,z+cz-d/2),new THREE.Vector3(x+w/2,h,z+cz+d/2)));
  });
  [[-4,3,-6.5,0.5,6,13],[4,3,-6.5,0.5,6,13],[0,3,-13,9,6,0.5]].forEach(([x,y,z,w,h,d])=>{
    walls.push(new THREE.Box3(new THREE.Vector3(x-w/2,0,z+cz-d/2),new THREE.Vector3(x+w/2,h,z+cz+d/2)));
  });
}

/* ═══════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════ */
function setupControls() {
  const canvas=document.getElementById('c');
  window.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyE'&&phase==='playing') tryOpenDoor(); });
  window.addEventListener('keyup',  e=>{ keys[e.code]=false; });
  canvas.addEventListener('click',  ()=>{ if(phase==='playing') canvas.requestPointerLock(); });
  document.addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==canvas||phase!=='playing') return;
    player.rot.y-=e.movementX*0.0023; player.rot.x-=e.movementY*0.0023;
    player.rot.x=Math.max(-1.25,Math.min(1.25,player.rot.x));
  });

  const mz=document.getElementById('move-zone'), ms=document.getElementById('move-stick');
  mz.addEventListener('touchstart',e=>{
    e.preventDefault(); const t=e.changedTouches[0];
    joy.move={id:t.identifier,sx:t.clientX,sy:t.clientY,dx:0,dy:0};
  },{passive:false});
  mz.addEventListener('touchmove',e=>{
    e.preventDefault();
    for (const t of e.changedTouches) {
      if(t.identifier!==joy.move.id) continue;
      const dx=t.clientX-joy.move.sx, dy=t.clientY-joy.move.sy;
      const dist=Math.min(40,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx);
      joy.move.dx=Math.cos(ang)*dist/40; joy.move.dy=Math.sin(ang)*dist/40;
      ms.style.transform=`translate(-50%,-50%) translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
    }
  },{passive:false});
  const rm=()=>{joy.move.dx=0;joy.move.dy=0;ms.style.transform='translate(-50%,-50%)';};
  mz.addEventListener('touchend',rm); mz.addEventListener('touchcancel',rm);

  const lz=document.getElementById('look-zone');
  lz.addEventListener('touchstart',e=>{
    e.preventDefault(); const t=e.changedTouches[0];
    joy.look={id:t.identifier,sx:t.clientX,sy:t.clientY};
  },{passive:false});
  lz.addEventListener('touchmove',e=>{
    e.preventDefault();
    for (const t of e.changedTouches) {
      if(t.identifier!==joy.look.id) continue;
      player.rot.y-=(t.clientX-joy.look.sx)*0.0048;
      player.rot.x-=(t.clientY-joy.look.sy)*0.0048;
      player.rot.x=Math.max(-1.25,Math.min(1.25,player.rot.x));
      joy.look.sx=t.clientX; joy.look.sy=t.clientY;
    }
  },{passive:false});
  lz.addEventListener('touchend',  ()=>{joy.look.id=null;});
  lz.addEventListener('touchcancel',()=>{joy.look.id=null;});
}

/* ═══════════════════════════════════════════════
   GAME START
═══════════════════════════════════════════════ */
function startGame() {

  fade.style.transition='opacity 0.55s'; fade.classList.remove('out');
  setTimeout(()=>{
    phase='playing';
    player.pos.set(0,1.6,35); player.rot.set(0,Math.PI,0); player.bob=0;
    Object.assign(trigger,{entered:false,graffitiDone:false,entryYaw:0,turned180:false,mudBreathing:false});
    scene.fog.density=0.18;
    document.getElementById('menu').style.display='none';
    document.getElementById('crosshair').style.display='flex';
    const mob='ontouchstart' in window||navigator.maxTouchPoints>0;
    document.getElementById('move-zone').style.display=mob?'block':'none';
    document.getElementById('look-zone').style.display=mob?'block':'none';
    if(!mob) document.getElementById('c').requestPointerLock();

    fade.style.transition='opacity 0.9s'; fade.classList.add('out');

}

/* ═══════════════════════════════════════════════
   TRIGGER
═══════════════════════════════════════════════ */
function checkTrigger() {
  const inZ=TRIG_BOX.containsPoint(player.pos);
  if (inZ&&!trigger.entered) {
    trigger.entered=true; trigger.entryYaw=player.rot.y;
    trigger.mudBreathing=true; sfx.triggerStab();
    if(!trigger.graffitiDone) {
      trigger.graffitiDone=true;
      setTimeout(()=>{
        const g=document.getElementById('graffiti-msg');
        g.classList.add('show');
        setTimeout(()=>g.classList.remove('show'),1500);
      },280);
    }
  }
  if (inZ&&trigger.entered&&!trigger.turned180) {
    let diff=Math.abs(player.rot.y-trigger.entryYaw)%(Math.PI*2);
    if(diff>Math.PI) diff=Math.PI*2-diff;
    if(diff>Math.PI*0.82) {
      trigger.turned180=true; scene.fog.density=0.52;
      treeGroups.forEach(grp=>{
        const d=Math.hypot(grp.position.x,grp.position.z-CHURCH_Z);
        if(d<28) grp.rotation.y+=(Math.random()-0.5)*0.45;
      });
    }
  }
  if(!inZ&&trigger.entered) {
    trigger.entered=false; trigger.mudBreathing=false;
    if(!trigger.turned180) scene.fog.density=0.18;
  }
  const near=player.pos.distanceTo(DOOR_POS)<3.2;
  document.getElementById('interact-prompt').style.display=near?'block':'none';
}

function tryOpenDoor() {
  if(player.pos.distanceTo(DOOR_POS)>3.2) return;
  sfx.doorCreak(); transitionPhase2();
}

function transitionPhase2() {
  if(phase==='transitioning') return; phase='transitioning';
  const fade=document.getElementById('fade');
  fade.style.transition='opacity 1.3s'; fade.classList.remove('out');
  setTimeout(()=>{
    document.getElementById('interact-prompt').style.display='none';
    document.getElementById('crosshair').style.display='none';
    bodyGroup.visible=false;
    /* TODO: Fase 2 — Nave Central */
  },1300);
}

/* ═══════════════════════════════════════════════
   UPDATE
═══════════════════════════════════════════════ */
function updatePlayer(dt) {
  let dx=joy.move.dx, dz=joy.move.dy;
  if(keys['KeyW']) dz-=1; if(keys['KeyS']) dz+=1;
  if(keys['KeyA']) dx-=1; if(keys['KeyD']) dx+=1;
  const moving=dx!==0||dz!==0;
  if(moving) {
    const mv=new THREE.Vector3(dx,0,dz).normalize();
    mv.applyAxisAngle(new THREE.Vector3(0,1,0),player.rot.y);
    const next=player.pos.clone().addScaledVector(mv,player.speed*dt);
    const pb=new THREE.Box3(
      new THREE.Vector3(next.x-player.radius,0,next.z-player.radius),
      new THREE.Vector3(next.x+player.radius,3.2,next.z+player.radius)
    );
    if(!walls.some(w=>pb.intersectsBox(w))) player.pos.copy(next);
    const now=clock.elapsedTime;
    if(now-lastStep>0.58) { sfx.footstep(); lastStep=now; }
    player.bob+=dt*5.5;
  }
  const bobY=moving?Math.sin(player.bob)*0.025:0;
  camera.position.set(player.pos.x,player.pos.y+bobY,player.pos.z);
  camera.rotation.copy(player.rot);

  flashlight.position.copy(camera.position);
  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  flashlight.target.position.copy(camera.position.clone().add(dir.multiplyScalar(8)));

  bodyGroup.position.copy(player.pos);
  bodyGroup.rotation.y=player.rot.y;
  checkTrigger();
}

function breatheGround(t) {
  if(!groundMesh||!trigger.mudBreathing) return;
  const pos=groundMesh.geometry.attributes.position;
  for(let i=0;i<pos.count;i++) {
    const lx=pos.getX(i),ly=pos.getY(i);
    pos.setZ(i,Math.sin(lx*0.85+t*0.95)*Math.sin(ly*0.85+t*0.72)*0.042);
  }
  pos.needsUpdate=true; groundMesh.geometry.computeVertexNormals();
}

/* ═══════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════ */
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  const t=clock.elapsedTime;

  if(phase==='menu'||phase==='loading') {
    camera.position.set(Math.sin(t*0.07)*0.35,2.2+Math.sin(t*0.11)*0.06,8);
    camera.rotation.set(-0.20+Math.sin(t*0.09)*0.008,0,0);
  }
  if(phase==='playing') {
    updatePlayer(dt); breatheGround(t);
    if(Math.random()>0.997) flashlight.intensity=0.2+Math.random()*0.5;
    else flashlight.intensity+=(flashBase-flashlight.intensity)*0.12;
  }

  const pl=scene.userData.ptLight;
  if(pl) pl.intensity=1.4+Math.sin(t*2.4)*0.14+(Math.random()-0.5)*0.07;
  const dl=scene.userData.doorLamp;
  if(dl) dl.intensity=1.2+Math.sin(t*3.1)*0.18+(Math.random()-0.5)*0.06;

  renderer.render(scene,camera);
}

/* ═══════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', ()=>{
  init();

  // Load GLTF models, then build world
  loadModels().then(()=>{
    buildEnvironment();

    // Hide loading, show menu
    document.getElementById('loading-screen').style.display='none';
    const menu=document.getElementById('menu');
    menu.style.display='flex';
    phase='menu';

    // Fade in
    const fade=document.getElementById('fade');
    fade.style.transition='opacity 0.9s';
    setTimeout(()=>fade.classList.add('out'),100);
  });

  document.getElementById('btn-start').addEventListener('click',()=>{ sfx.init(); sfx.resume(); startGame(); });
  document.getElementById('btn-quit').addEventListener('click',()=>{
    const fade=document.getElementById('fade');
    fade.style.transition='opacity 0.6s'; fade.classList.remove('out');
    setTimeout(()=>window.close(),650);
  });
});
</script>
</body>
